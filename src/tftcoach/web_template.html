<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFT Coach</title>
  <style>
    :root {
      --bg: #111315;
      --panel: #1a1d20;
      --line: #34393d;
      --text: #edf1f2;
      --muted: #aab3b7;
      --accent: #9fd6bd;
      --warn: #efb45c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI Variable", "Noto Sans KR", sans-serif;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 0 24px;
    }
    header strong { font-size: 15px; }
    main {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 18px;
    }
    section { padding: 18px 22px; }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, textarea, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #121416;
      color: var(--text);
      font: inherit;
    }
    input { height: 38px; padding: 0 10px; }
    textarea { min-height: 82px; resize: vertical; padding: 9px 10px; }
    button {
      height: 40px;
      margin-top: 14px;
      border-color: var(--accent);
      background: var(--accent);
      color: #102019;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .summary {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .summary span {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      color: var(--muted);
      font-size: 12px;
    }
    .list { display: grid; gap: 8px; }
    .item {
      display: grid;
      grid-template-columns: 34px 150px 70px minmax(180px, 1fr);
      align-items: start;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
    }
    .order { color: var(--accent); font-weight: 800; }
    .action { font-weight: 700; }
    .score { color: var(--warn); font-variant-numeric: tabular-nums; }
    .reason { color: var(--muted); line-height: 1.5; }
    .empty { color: var(--muted); padding: 20px 0; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .item { grid-template-columns: 30px 1fr 62px; }
      .reason { grid-column: 2 / 4; }
    }
  </style>
</head>
<body>
  <header><strong>TFT Coach 분석기</strong></header>
  <main>
    <aside>
      <div class="field-grid">
        <label>스테이지<input id="stage" value="4-5"></label>
        <label>라운드<input id="roundType" value="pvplive"></label>
        <label>체력<input id="health" type="number" value="50" min="0" max="100"></label>
        <label>골드<input id="gold" type="number" value="30" min="0"></label>
        <label>레벨<input id="level" type="number" value="8" min="1" max="10"></label>
        <label>기물 수<input id="boardCount" type="number" value="8" min="0" max="10"></label>
      </div>
      <label style="margin-top:10px">보드 기물 (쉼표 구분)
        <textarea id="board">가렌, 샤코, 애쉬, 세트, 레이블, 벡스, 진, 카이사</textarea>
      </label>
      <label style="margin-top:10px">상대 기물 수 (쉼표 구분)
        <textarea id="opponents">상대1, 상대2, 상대3, 상대4</textarea>
      </label>
      <label style="margin-top:10px">보유 아이템 (쉼표 구분)
        <textarea id="items">거인학살자, 피바디, 밤의끝자락</textarea>
      </label>
      <button id="submit">추천 계산</button>
    </aside>
    <section>
      <div class="summary" id="summary"></div>
      <div class="list" id="results"><div class="empty">상황을 입력하고 추천 계산을 실행하세요.</div></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const split = (value) => value.split(',').map((item) => item.trim()).filter(Boolean);

    $('submit').addEventListener('click', async () => {
      const button = $('submit');
      button.disabled = true;
      button.textContent = '계산 중';

      const board = split($('board').value);
      const opponents = split($('opponents').value);
      const items = split($('items').value);

      try {
        const response = await fetch('/api/recommend', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            stage: $('stage').value,
            round_type: $('roundType').value,
            health: Number($('health').value),
            gold: Number($('gold').value),
            level: Number($('level').value),
            board,
            opponents,
            items
          })
        });
        const data = await response.json();
        $('summary').innerHTML = `<span>스테이지 ${data.context.stage}</span><span>체력 ${data.context.health}</span><span>골드 ${data.context.gold}</span><span>레벨 ${data.context.level}</span>`;
        $('results').innerHTML = data.recommendations.map((item) => `
          <article class="item">
            <div class="order">${item.execution_order}</div>
            <div><div class="action">${item.action}</div><small>${item.confidence} · 표본 ${item.sample_count}</small></div>
            <div class="score">${item.score.toFixed(3)}</div>
            <div class="reason">${item.reason}</div>
          </article>
        `).join('');
      } catch (error) {
        $('results').innerHTML = '<div class="empty">추천 계산에 실패했습니다.</div>';
      } finally {
        button.disabled = false;
        button.textContent = '추천 계산';
      }
    });
  </script>
</body>
</html>
